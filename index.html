<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon/pabitra-avatar-black.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letters</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      const favicon = document.querySelector("link[rel='icon']");

      const updateFavicon = (isDark) => {
        if (favicon) {
          favicon.href = isDark ? '/icon/pabitra-avatar-white.svg' : '/icon/pabitra-avatar-black.svg';
        }
      };

      updateFavicon(mediaQuery.matches);
      mediaQuery.addEventListener('change', (e) => updateFavicon(e.matches));
    </script>
  </body>
</html>
